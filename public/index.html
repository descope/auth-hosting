<!doctype html>
<html lang="en">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500;700;800&display=swap');
	</style>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<script>
			// Anchor relative asset URLs (./env.js, ./static/...) to the app mount root, i.e.
			// everything up to and including the "login" segment (package.json "homepage").
			// This keeps them correct for /login, /login/<pid>/, and /auth/login/<pid> alike.
			(function () {
				var segments = window.location.pathname.split('/');
				var index = segments.indexOf('login');
				var base = document.createElement('base');
				base.href =
					index < 0 ? '/' : segments.slice(0, index + 1).join('/') + '/';
				document.head.appendChild(base);
			})();
		</script>
		<script src="%PUBLIC_URL%/env.js"></script>
		<script>
			// Paint the bg color before the bundle loads, otherwise the page is white
			// until React mounts. Mirrors normalizeBackgroundParam in App.tsx; image
			// URLs and other invalid values are ignored by the CSSOM, React handles them.
			(function () {
				var bg =
					new URLSearchParams(window.location.search).get('bg') ||
					(window.env &&
						(window.env.DESCOPE_BG || window.env.DESCOPE_BG_COLOR));
				if (!bg) return;
				bg = bg.trim();
				if (/^([0-9A-Fa-f]{3,4}|[0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$/.test(bg))
					bg = '#' + bg;
				document.documentElement.style.backgroundColor = bg;
			})();
		</script>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
		<!--

	</body>
</html>
